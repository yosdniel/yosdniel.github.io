<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindspace Universe</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/yosdniel/yosdniel.github.io/9a9fb66d9306be7be63bd1fec355ae5bccd21e60/assets/favicon.ico">

    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 font-sans text-white min-h-full flex items-center justify-center p-4 selection:bg-sky-500 selection:text-white relative overflow-hidden" 
      style="-webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;"
      oncontextmenu="return false;">

    <!-- Ambient Dark Blue & Sky Glassmorphism Glows -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-32 -left-32 w-[600px] h-[600px] bg-sky-600/20 rounded-full blur-[140px]"></div>
        <div class="absolute top-1/2 -right-32 w-[600px] h-[600px] bg-indigo-600/15 rounded-full blur-[140px]"></div>
        <div class="absolute -bottom-32 left-1/3 w-[600px] h-[600px] bg-blue-700/20 rounded-full blur-[140px]"></div>
    </div>

    <!-- Main Content Container (Tanpa Frame) -->
    <main class="relative z-10 max-w-5xl w-full text-center flex flex-col items-center justify-center">
        <!-- Logo -->
        <img class="w-36 h-36 sm:w-48 sm:h-48 md:w-56 md:h-56 mb-8 sm:mb-10 object-contain pointer-events-none select-none drop-shadow-2xl" 
             src="https://raw.githubusercontent.com/yosdniel/yosdniel.github.io/9a9fb66d9306be7be63bd1fec355ae5bccd21e60/assets/favicon512.png" 
             alt="Mindspace Universe Logo"
             draggable="false">
        
        <!-- Judul Utama -->
        <h1 class="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-black tracking-tight leading-none mb-4 sm:mb-6 text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-slate-400">
            Mindspace Universe
        </h1>

        <!-- Subtitle / URL -->
        <p class="text-lg sm:text-2xl md:text-3xl font-semibold text-slate-400 tracking-wider">
            www.mindspace.id
        </p>
    </main>

    <!-- Script Proteksi Anti-Shortcut Keyboard -->
    <script>
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'c' || e.key === 'u' || e.key === 's')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
