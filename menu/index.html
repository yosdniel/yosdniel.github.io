<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#030712">
    <title>Menu Hari Ini · SPPG Bantaeng Gantarangkeke 1</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#0f172a',
                            900: '#090d16',
                            950: '#030712',

                        royal: {
                            400: '#38bdf8',

                            600: '#0369a1',

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    
    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.12);
        }
        .glass-card {
            background: rgba(11, 19, 36, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .sekat-card {
            opacity: 0;
            transform: translateY(12px);
            animation: cardAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .sekat-card:nth-child(1) { animation-delay: 0.05s; }
        .sekat-card:nth-child(2) { animation-delay: 0.12s; }
        .sekat-card:nth-child(3) { animation-delay: 0.19s; }
        .sekat-card:nth-child(4) { animation-delay: 0.26s; }
        .sekat-card:nth-child(5) { animation-delay: 0.33s; }

        @keyframes cardAppear {
            to { opacity: 1; transform: translateY(0); }
        }

        .himbauan-glow {
            animation: ambientGlow 3.5s ease-in-out infinite alternate;
        }
        @keyframes ambientGlow {
            0% { border-color: rgba(2, 132, 199, 0.25); box-shadow: 0 0 20px -5px rgba(2, 132, 199, 0.1); }
            100% { border-color: rgba(56, 189, 248, 0.45); box-shadow: 0 0 25px 2px rgba(2, 132, 199, 0.2); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(3, 7, 18, 0.8); }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.25); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.5); }
    </style>
</head>
<body class="bg-slate-950 font-sans text-slate-200 antialiased min-h-full flex flex-col selection:bg-royal-500 selection:text-white">

    <!-- Ambient Dark Blue Background Glows -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-royal-700/15 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-sky-600/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 left-1/3 w-96 h-96 bg-indigo-900/15 rounded-full blur-3xl"></div>
    </div>

    <div class="relative z-10 flex-1 flex flex-col max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6 lg:py-8">
        
        <!-- Header Section -->
        <header class="glass-panel rounded-3xl p-5 sm:p-7 mb-6 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-gradient-to-br from-royal-500/15 to-transparent rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                <!-- Brand Info -->
                <div class="flex items-center gap-4 sm:gap-5">
                    <div class="relative">
                        <div class="absolute -inset-1 bg-gradient-to-r from-royal-500 to-sky-400 rounded-2xl blur opacity-30"></div>
                        <img class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl object-cover bg-slate-900 border border-royal-500/30" 
                             src="https://placehold.co/120x120/0f172a/38bdf8?text=SPPG" 
                             alt="Logo Badan Gizi Nasional">
                    </div>
                    <div>
                        <div class="inline-flex items-center gap-2 px-2.5 py-0.5 rounded-full bg-royal-500/10 border border-royal-400/20 text-royal-400 text-[11px] font-bold uppercase tracking-wider mb-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-royal-400 animate-pulse"></span>
                            Makan Bergizi Gratis
                        </div>
                        <!-- Nama SPPG & Yayasan Dinamis dari DB -->
                        <h1 class="text-lg sm:text-2xl font-extrabold text-white tracking-tight leading-snug" id="nama-sppg">SPPG Bantaeng Gantarangkeke 1</h1>
                        <p class="text-xs sm:text-sm font-medium text-slate-400" id="nama-yayasan">Yayasan Tunas Ilmu Bantaeng · Badan Gizi Nasional</p>
                    </div>
                </div>

                <!-- Date Badge -->
                <div class="flex flex-col md:items-end border-t md:border-t-0 border-slate-800 pt-4 md:pt-0">
                    <div class="text-[10px] uppercase font-bold tracking-widest text-royal-400 mb-0.5">Sajian Hari Ini</div>
                    <div class="text-xl sm:text-2xl lg:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-slate-400 tracking-tight flex items-center gap-2" id="hari-tanggal-sekarang">
                        <span>Memuat…</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="flex-1 flex flex-col gap-6" id="isi">
            <!-- Loading State -->
            <div class="glass-panel rounded-3xl p-12 text-center my-auto flex flex-col items-center justify-center">
                <div class="w-12 h-12 border-4 border-royal-500/20 border-t-royal-400 rounded-full animate-spin mb-4"></div>
                <h2 class="text-lg font-bold text-white mb-1">Menyiapkan Menu Bergizi</h2>
                <p class="text-sm text-slate-400">Sedang mengambil data dari server...</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="mt-8 pt-6 border-t border-slate-900 text-center sm:flex sm:items-center sm:justify-between text-xs text-slate-500 gap-4">
            <p>Disiapkan di dapur <b class="text-slate-300 font-semibold">SPPG Bantaeng Gantarangkeke 1</b></p>
            <p class="mt-2 sm:mt-0 text-slate-500">Yayasan Tunas Ilmu Bantaeng · Badan Gizi Nasional</p>
        </footer>
    </div>

    <script>
        /* ============================================================ 
           PENGATURAN — Ganti URL API dengan Endpoint Supabase/Vercel Anda 
           ============================================================ */
        const API = 'http://localhost:3000/api/menu';
        const ZONA = 'Asia/Jakarta';

        const PORSI = {
            pk: { nama: 'Porsi Kecil', ket: 'PAUD–SD Kelas 3' },
            pb: { nama: 'Porsi Besar', ket: 'SD Kelas 4–SMA' }
        };

        let HIMBAUAN = [
            { ikon: 'jam', judul: 'Segera Dimakan Setelah Diterima', isi: 'Habiskan langsung di tempat. Makanan ini disajikan segar tanpa bahan pengawet sintesis.' },
            { ikon: 'larang', judul: 'Tidak Boleh Dibawa Pulang', isi: 'Kesegaran, nutrisi, dan keamanan makanan hanya terjaga optimal jika dimakan langsung di sekolah.' }
        ];

        const PENGADUAN = [
            { kanal: 'Instagram', nama: '@sppggantarangkeke1', ikon: 'ig', url: 'https://instagram.com/sppggantarangkeke1' },
            { kanal: 'Facebook', nama: 'Sppg Tunas Ilmu Gantarangkeke', ikon: 'fb', url: '' }
        ];

        const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
        const SINGK = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
        const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

        const SEKAT = [
            { kunci: 'makanan_pokok', tag: 'Makanan Pokok', desc: 'Karbohidrat Utama' },
            { kunci: 'lauk_hewani', tag: 'Lauk Hewani', desc: 'Protein Hewani' },
            { kunci: 'lauk_nabati', tag: 'Lauk Nabati', desc: 'Protein Nabati' },
            { kunci: 'sayur', tag: 'Sayur Segar', desc: 'Serat & Vitamin' },
            { kunci: 'buah', tag: 'Buah-Buahan', desc: 'Vitamin & Mineral' }
        ];

        const ZAT = [
            { kunci: 'energi', satuan: 'kkal', label: 'Energi Total', utama: true },
            { kunci: 'protein', satuan: 'g', label: 'Protein' },
            { kunci: 'lemak', satuan: 'g', label: 'Lemak' },
            { kunci: 'karbohidrat', satuan: 'g', label: 'Karbohidrat' },
            { kunci: 'serat', satuan: 'g', label: 'Serat Pangan' }
        ];

        const IKON = {
            jam: '<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.2v5l3.2 2"/></svg>',
            larang: '<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 10.6 12 4.2l7.8 6.4V20H4.2z"/><path d="M3 21 21 3"/></svg>',
            ig: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5.2"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor" stroke="none"/></svg>',
            fb: '<svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M13.5 21v-7h2.4l.4-2.9h-2.8V9.3c0-.84.23-1.42 1.44-1.42h1.5V5.27c-.26-.04-1.16-.11-2.2-.11-2.18 0-3.67 1.33-3.67 3.77v2.17H8.2V14h2.37v7h2.93z"/></svg>',
            info: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6v.01"/></svg>'
        };
        const IKON_AWAS = '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><path d="M12 17.5v.01"/></svg>';

        let dataMinggu = [];
        let menuAktif = null;

        const el = (id) => document.getElementById(id);

        function tanggalHariIni() {
            return new Intl.DateTimeFormat('en-CA', { timeZone: ZONA, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        }

        function keDate(ymd) {
            const b = ymd.split('-');
            return new Date(+b[0], +b[1] - 1, +b[2]);
        }

        function esc(t) {
            return String(t == null ? '' : t).replace(/[<>&"]/g, function(c) {
                return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c];
            });
        }

        function adaIsi(g) {
            return !!(g && (g.energi || g.protein || g.lemak || g.karbohidrat || g.serat));
        }

        function gambarKepala(ymd) {
            const d = keDate(ymd);
            const elHeaderTanggal = el('hari-tanggal-sekarang');
            if (elHeaderTanggal) {
                const teksHariTanggal = `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
                elHeaderTanggal.innerHTML = `<svg class="w-5 h-5 text-royal-400 inline-block flex-none" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg> <span>${teksHariTanggal}</span>`;
            }
        }

        function gagal(pesan) {
            const elHeaderTanggal = el('hari-tanggal-sekarang');
            if (elHeaderTanggal) {
                const d = new Date();
                elHeaderTanggal.textContent = `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
            }
            el('isi').innerHTML = '<div class="glass-panel rounded-3xl p-12 text-center my-8 border border-red-500/20 bg-red-500/5">'
                + '<h3 class="text-lg font-bold text-red-400 mb-2">Gagal Memuat Data Menu</h3>'
                + '<p class="text-sm text-slate-400 max-w-md mx-auto">' + (pesan || 'Periksa koneksi internet Anda lalu muat ulang halaman ini.') + '</p>'
                + '</div>';
        }

        function apiSiap() {
            return API && API.startsWith('http');
        }

        (function() {
            if (!apiSiap()) {
                gagal('Konstanta API di skrip belum dikonfigurasi dengan URL API yang valid.');
                return;
            }
            const hariIni = tanggalHariIni();
            fetch(API + '?tanggal=' + hariIni)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (!data.ok) throw new Error('gagal');
                    dataMinggu = data.minggu || [];
                    if (data.himbauan && data.himbauan.length) HIMBAUAN = data.himbauan;
                    
                    // Gunakan tanggal hari ini dari API jika tersedia
                    const targetTanggal = data.today || hariIni;

                    try {
                        localStorage.setItem('menu-sppg', JSON.stringify({ hariIni: targetTanggal, minggu: dataMinggu, himbauan: HIMBAUAN }));
                    } catch (e) {}

                    tampilkan(targetTanggal);
                })
                .catch(function() {
                    let simpan = null;
                    try { simpan = localStorage.getItem('menu-sppg'); } catch (e) {}
                    if (simpan) {
                        const c = JSON.parse(simpan);
                        dataMinggu = c.minggu || [];
                        if (c.himbauan && c.himbauan.length) HIMBAUAN = c.himbauan;
                        const punya = dataMinggu.some(function(m) { return m.tanggal === hariIni; });
                        tampilkan(punya ? hariIni : (c.hariIni || hariIni));
                    } else gagal();
                });
        })();
    </script>
</body>
</html>
