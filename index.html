<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindspace Universe</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/yosdniel/yosdniel.github.io/9a9fb66d9306be7be63bd1fec355ae5bccd21e60/assets/favicon.ico">

    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Animasi Text Gradient Flow */
        .animated-gradient-text {
            background: linear-gradient(
                -45deg, 
                #ffffff 0%, 
                #38bdf8 25%, 
                #818cf8 50%, 
                #c084fc 75%, 
                #ffffff 100%
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animasi Pop-up halus saat pertama muat */
        .fade-in-up {
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body class="bg-slate-950 font-sans text-white min-h-full flex items-center justify-center p-4 selection:bg-sky-500 selection:text-white relative overflow-hidden" 
      style="-webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;"
      oncontextmenu="return false;">

    <!-- Ambient Dark Blue & Sky Glassmorphism Glows -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-32 -left-32 w-[600px] h-[600px] bg-sky-600/20 rounded-full blur-[140px]"></div>
        <div class="absolute top-1/2 -right-32 w-[600px] h-[600px] bg-indigo-600/15 rounded-full blur-[140px]"></div>
        <div class="absolute -bottom-32 left-1/3 w-[600px] h-[600px] bg-blue-700/20 rounded-full blur-[140px]"></div>
    </div>

    <!-- Main Content Container (Tanpa Frame + Animasi) -->
    <main class="relative z-10 max-w-6xl w-full text-center flex flex-col items-center justify-center fade-in-up">
        <!-- Logo (Margin bottom diperkecil jadi mb-2 sm:mb-4 agar rapat ke teks) -->
        <img class="w-32 h-32 sm:w-48 sm:h-48 md:w-56 md:h-56 mb-2 sm:mb-4 object-contain pointer-events-none select-none drop-shadow-[0_10px_35px_rgba(56,189,248,0.2)]" 
             src="https://raw.githubusercontent.com/yosdniel/yosdniel.github.io/9a9fb66d9306be7be63bd1fec355ae5bccd21e60/assets/favicon512.png" 
             alt="Mindspace Universe Logo"
             draggable="false">
        
        <!-- Judul Utama -->
        <h1 class="text-[7.5vw] sm:text-6xl md:text-7xl lg:text-8xl font-black tracking-tight leading-none mb-3 sm:mb-6 whitespace-nowrap animated-gradient-text">
            Mindspace Universe
        </h1>

        <!-- Subtitle / URL -->
        <p class="text-base sm:text-2xl md:text-3xl font-semibold text-slate-400 tracking-wider">
            www.mindspace.id
        </p>
    </main>

    <!-- Script Proteksi Anti-Shortcut Keyboard -->
    <script>
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'c' || e.key === 'u' || e.key === 's')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
