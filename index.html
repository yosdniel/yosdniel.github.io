<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin Lisensi - Mindspace Studio</title>
  
  <!-- FAVICON & PWA MANIFEST -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z'/></svg>">
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Dashboard%20Admin%20Lisensi%22%2C%22short_name%22%3A%22AdminSIPGN%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230b1329%22%2C%22theme_color%22%3A%22%232563eb%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2527http%253A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%2520viewBox%253D%25270%25200%252024%252024%2527%2520fill%253D%2527%252338bdf8%2527%253E%253Cpath%2520d%253D%2527M12%25201L3%25205v6c0%25205.55%25203.84%252010.74%25209%252012%25205.16-1.26%25209-6.45%25209-12V5l-9-4zm0%252010.99h7c-.53%25204.12-3.28%25207.79-7%25208.94V12H5V6.3l7-3.11v8.8z%2527%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
  <meta name="theme-color" content="#2563eb">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1329; color: #f8fafc; margin: 0; padding: 16px;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .container {
      width: 100%; max-width: 480px; background: #1e293b; border: 1px solid #334155;
      border-radius: 20px; padding: 24px; box-shadow: 0 16px 36px rgba(0,0,0,0.5);
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 20px; font-weight: 700; margin: 0; color: #f8fafc; }
    .header p { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    
    .field-group { margin-bottom: 16px; }
    label { font-size: 12px; font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 6px; }
    input, select {
      width: 100%; height: 46px; padding: 0 14px; border-radius: 10px;
      border: 1px solid #334155; background: #0f172a; color: #f8fafc; font-size: 14px;
      outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #38bdf8; }
    
    .btn {
      width: 100%; height: 46px; border-radius: 10px; border: none;
      font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #059669; color: white; }
    .btn-success:hover { background: #047857; }
    .btn-warning { background: #d97706; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-secondary { background: #475569; color: white; }
    .btn-secondary:hover { background: #334155; }
    .btn-install { background: #7c3aed; color: white; display: none; margin-bottom: 12px; }
    .btn-install:hover { background: #6d28d9; }
    
    .card-info {
      background: #0f172a; border: 1px solid #334155; border-radius: 12px;
      padding: 14px; margin-bottom: 16px; font-size: 13px; line-height: 1.6;
    }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold;
    }
    .badge-active { background: #065f46; color: #34d399; }
    .badge-hold { background: #78350f; color: #fbbf24; }
    .badge-revoked { background: #7f1d1d; color: #fca5a5; }
    .badge-expired { background: #9a3412; color: #ffedd5; }
    .badge-unregistered { background: #334155; color: #94a3b8; }

    .grid-durasi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .btn-quick {
      height: 38px; background: #334155; color: #f8fafc; border: 1px solid #475569;
      border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-quick:hover { background: #475569; }
    .btn-quick-lifetime {
      background: #7c3aed; border-color: #6d28d9; color: #f3e8ff;
    }
    .btn-quick-lifetime:hover {
      background: #6d28d9;
    }

    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #0f172a; border: 1px solid #334155; padding: 12px 20px;
      border-radius: 10px; font-size: 13px; display: none; z-index: 999; color: white;
    }

    #step1, #step2 { display: none; }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <div class="container">
    <div class="header">
      <h1>Dashboard Kelola Lisensi</h1>
      <p>Mindspace Studio Admin Panel</p>
    </div>

    <!-- TOMBOL INSTALL / BUAT PINTASAN APLIKASI -->
    <button id="btnInstallApp" class="btn btn-install" onclick="installAplikasiPWA()">
      📱 Install Sebagai Aplikasi Android
    </button>

    <!-- TAHAP 0: VERIFIKASI PASSWORD ADMIN -->
    <div id="step0">
      <div class="field-group">
        <label for="inputAdminPassword">Masukkan Password Admin Dashboard:</label>
        <input type="password" id="inputAdminPassword" placeholder="••••••••••••" onkeyup="if(event.key==='Enter') verifikasiAdminPassword()">
      </div>
      <button class="btn btn-primary" id="btnLogin" onclick="verifikasiAdminPassword()">🔒 Masuk Ke Dashboard</button>
    </div>

    <!-- TAHAP 1: CEK DEVICE ID -->
    <div id="step1">
      <div class="field-group">
        <label for="inputDeviceId">Masukkan Device ID:</label>
        <input type="text" id="inputDeviceId" placeholder="DEV-XXXX-XXXX" style="text-transform: uppercase;" onkeyup="if(event.key==='Enter') cekDeviceId()">
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-primary" style="flex: 2;" onclick="cekDeviceId()">🔎 Periksa Device ID</button>
        <button class="btn btn-secondary" style="flex: 1;" onclick="logoutAdmin()">🚪 Keluar</button>
      </div>
    </div>

    <!-- TAHAP 2: PANEL KONTROL KELOLA LISENSI -->
    <div id="step2">
      <div class="card-info">
        <div><b>Device ID:</b> <span id="dispDeviceId" style="color:#facc15;">-</span></div>
        <div><b>Status Saat Ini:</b> <span id="dispStatus">-</span></div>
        <div><b>Tanggal Kadaluarsa:</b> <span id="dispExpDate" style="color:#38bdf8;">-</span></div>
      </div>

      <div class="field-group">
        <label>Aksi Cepat Tambah Durasi:</label>
        <div class="grid-durasi">
          <button class="btn-quick" onclick="tambahHari(1)">+1 Hari</button>
          <button class="btn-quick" onclick="tambahHari(7)">+7 Hari</button>
          <button class="btn-quick" onclick="tambahHari(14)">+14 Hari</button>
          <button class="btn-quick" onclick="tambahHari(30)">+30 Hari</button>
          <button class="btn-quick" onclick="tambahHari(60)">+60 Hari</button>
          <button class="btn-quick btn-quick-lifetime" onclick="setLifetime()">♾️ Lifetime</button>
        </div>
      </div>

      <div class="field-group">
        <label for="editExpDate">Atur Tanggal Kadaluarsa Manual:</label>
        <input type="date" id="editExpDate" onchange="cekOtomatisStatusTanggal()">
      </div>

      <div class="field-group">
        <label for="editStatus">Ubah Status Lisensi:</label>
        <select id="editStatus" onchange="ubahStatusDropdown(this.value)">
          <option value="active">Active (Lisensi Berjalan)</option>
          <option value="hold">Hold (Ditangguhkan Sementara)</option>
          <option value="revoked">Revoke (Dicabut Permanent)</option>
          <option value="expired" disabled>Expired (Masa Aktif Habis)</option>
          <option value="unregistered" disabled>Unregistered (Belum Terdaftar)</option>
        </select>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
        <button class="btn btn-success" onclick="simpanPerubahan()">💾 Simpan Perubahan</button>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-danger" style="flex: 1;" id="btnHapusLisensi" onclick="hapusLisensi()">🗑️ Hapus Lisensi</button>
          <button class="btn btn-secondary" style="flex: 1;" onclick="resetForm()">↩️ Kembali</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const VERCEL_BASE_URL = 'https://mindspace-id.vercel.app';
    const VERCEL_API_URL = `${VERCEL_BASE_URL}/api/tokopay`;
    const VERIFY_PASS_URL = `${VERCEL_BASE_URL}/api/verify-pass`;
    const SECRET_SALT = 'MINDSTUDIO2026';

    let adminPasswordSecret = '';
    let currentLicenseData = null;
    let deferredPrompt = null;

    // --- FITUR PWA / INSTALL KE ANDROID ---
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btnInstall = document.getElementById('btnInstallApp');
      if (btnInstall) btnInstall.style.display = 'flex';
    });

    async function installAplikasiPWA() {
      if (!deferredPrompt) {
        showToast('Gunakan menu titik tiga (⋮) di Chrome lalu pilih "Tambahkan ke Layar Utama".', false);
        return;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        document.getElementById('btnInstallApp').style.display = 'none';
      }
      deferredPrompt = null;
    }

    function getTanggalHariIniWIB() {
      return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' });
    }

    function showToast(msg, isSuccess = true) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.borderColor = isSuccess ? '#059669' : '#dc2626';
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2800);
    }

    function buatLicenseKey(expDate, deviceId) {
      const nonce = Math.floor(Math.random() * 16777215).toString(16).toUpperCase();
      const payload = `${expDate}|${deviceId}|ADMIN|${SECRET_SALT}|${nonce}`;
      const encoded = btoa(payload).split('').reverse().join('');
      return `MIND-${encoded}`;
    }

    async function verifikasiAdminPassword() {
      const passInput = document.getElementById('inputAdminPassword').value.trim();
      const btnLogin = document.getElementById('btnLogin');

      if (!passInput) return showToast('Masukkan password admin terlebih dahulu!', false);

      btnLogin.disabled = true;
      btnLogin.textContent = '⏳ Memeriksa...';

      try {
        const res = await fetch(VERIFY_PASS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passInput })
        });

        const data = await res.json();

        if (res.ok && data.status) {
          adminPasswordSecret = passInput;
          document.getElementById('step0').style.display = 'none';
          document.getElementById('step1').style.display = 'block';
          showToast('Akses Admin Diterima.', true);
        } else {
          showToast(data.error || 'Password salah!', false);
        }
      } catch (e) {
        showToast('Gagal terhubung ke API Verifikasi Password.', false);
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = '🔒 Masuk Ke Dashboard';
      }
    }

    function logoutAdmin() {
      adminPasswordSecret = '';
      document.getElementById('inputAdminPassword').value = '';
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step0').style.display = 'block';
      showToast('Berhasil keluar.', true);
    }

    async function cekDeviceId() {
      const deviceId = document.getElementById('inputDeviceId').value.trim().toUpperCase();
      if (!deviceId) return showToast('Masukkan Device ID terlebih dahulu!', false);

      try {
        const res = await fetch(`${VERCEL_API_URL}?action=check_license&device_id=${encodeURIComponent(deviceId)}`);
        const data = await res.json();

        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        document.getElementById('dispDeviceId').textContent = deviceId;

        const hariIni = getTanggalHariIniWIB();

        if (data.exp_date || data.status) {
          let statusAktual = data.status || 'active';

          if (statusAktual === 'active' && data.exp_date && hariIni > data.exp_date) {
            statusAktual = 'expired';
          }

          currentLicenseData = {
            device_id: deviceId,
            exp_date: data.exp_date || hariIni,
            status: statusAktual,
            license_key: data.license_key || buatLicenseKey(data.exp_date || hariIni, deviceId),
            is_new: false
          };
        } else {
          currentLicenseData = {
            device_id: deviceId,
            exp_date: '-',
            status: 'unregistered',
            license_key: '',
            is_new: true
          };
          showToast('Device ID belum terdaftar. Silakan tentukan durasi.', true);
        }

        renderDetail();
      } catch (e) {
        showToast('Gagal terhubung ke Server Vercel/Supabase!', false);
      }
    }

    function renderDetail() {
      document.getElementById('dispExpDate').textContent = currentLicenseData.exp_date !== '-' ? currentLicenseData.exp_date : 'Belum Diatur';
      document.getElementById('editExpDate').value = currentLicenseData.exp_date !== '-' ? currentLicenseData.exp_date : getTanggalHariIniWIB();
      
      const selectStatus = document.getElementById('editStatus');
      selectStatus.value = currentLicenseData.status;

      const stEl = document.getElementById('dispStatus');
      if (currentLicenseData.status === 'active') {
        stEl.innerHTML = '<span class="badge badge-active">Active</span>';
      } else if (currentLicenseData.status === 'hold') {
        stEl.innerHTML = '<span class="badge badge-hold">Hold</span>';
      } else if (currentLicenseData.status === 'revoked') {
        stEl.innerHTML = '<span class="badge badge-revoked">Revoked</span>';
      } else if (currentLicenseData.status === 'expired') {
        stEl.innerHTML = '<span class="badge badge-expired">Expired (Kadaluarsa)</span>';
      } else {
        stEl.innerHTML = '<span class="badge badge-unregistered">Belum Terdaftar</span>';
      }

      const btnHapus = document.getElementById('btnHapusLisensi');
      if (btnHapus) {
        btnHapus.style.display = currentLicenseData.is_new ? 'none' : 'block';
      }
    }

    function ubahStatusDropdown(val) {
      if (currentLicenseData) {
        currentLicenseData.status = val;
        renderDetail();
      }
    }

    function cekOtomatisStatusTanggal() {
      const selectedExp = document.getElementById('editExpDate').value;
      if (!selectedExp) return;

      const hariIni = getTanggalHariIniWIB();
      currentLicenseData.exp_date = selectedExp;

      if (selectedExp >= hariIni && (currentLicenseData.status === 'expired' || currentLicenseData.status === 'unregistered')) {
        currentLicenseData.status = 'active';
      } else if (selectedExp < hariIni && currentLicenseData.status === 'active') {
        currentLicenseData.status = 'expired';
      }

      renderDetail();
    }

    function tambahHari(jumlahHari) {
      let baseDate = new Date();
      
      if (currentLicenseData.exp_date && currentLicenseData.exp_date !== '-' && new Date(currentLicenseData.exp_date) > baseDate) {
        baseDate = new Date(currentLicenseData.exp_date);
      }

      baseDate.setDate(baseDate.getDate() + jumlahHari);
      const yyyy = baseDate.getFullYear();
      const mm = String(baseDate.getMonth() + 1).padStart(2, '0');
      const dd = String(baseDate.getDate()).padStart(2, '0');

      currentLicenseData.exp_date = `${yyyy}-${mm}-${dd}`;
      currentLicenseData.status = 'active';
      currentLicenseData.license_key = buatLicenseKey(currentLicenseData.exp_date, currentLicenseData.device_id);
      
      renderDetail();
      showToast(`Durasi diatur: +${jumlahHari} hari`);
    }

    function setLifetime() {
      currentLicenseData.exp_date = '2099-12-31';
      currentLicenseData.status = 'active';
      currentLicenseData.license_key = buatLicenseKey(currentLicenseData.exp_date, currentLicenseData.device_id);

      renderDetail();
      showToast('Durasi diatur: Lifetime (2099-12-31)');
    }

    async function simpanPerubahan() {
      const expDateVal = document.getElementById('editExpDate').value;
      let statusVal = document.getElementById('editStatus').value;

      if (!expDateVal) return showToast('Pilih tanggal kadaluarsa!', false);

      if ((statusVal === 'expired' || statusVal === 'unregistered') && expDateVal >= getTanggalHariIniWIB()) {
        statusVal = 'active';
      }

      currentLicenseData.exp_date = expDateVal;
      currentLicenseData.status = statusVal;
      currentLicenseData.license_key = buatLicenseKey(expDateVal, currentLicenseData.device_id);

      try {
        const res = await fetch(VERCEL_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'save_license',
            device_id: currentLicenseData.device_id,
            license_key: currentLicenseData.license_key,
            exp_date: currentLicenseData.exp_date,
            status: currentLicenseData.status
          })
        });

        const resData = await res.json();

        if (res.ok && (resData.success || resData.status)) {
          showToast('Data lisensi BERHASIL disimpan ke Supabase!');
          currentLicenseData.is_new = false;
          renderDetail();
        } else {
          showToast(resData.message || 'Gagal menyimpan ke database.', false);
        }
      } catch (e) {
        showToast('Error koneksi saat menyimpan lisensi.', false);
      }
    }

    async function hapusLisensi() {
      if (!currentLicenseData || !currentLicenseData.device_id) return;
      
      const konfirmasi = confirm(`Apakah Anda yakin ingin MENGHAPUS lisensi Device ID "${currentLicenseData.device_id}" secara permanen dari Supabase?`);
      if (!konfirmasi) return;

      try {
        const res = await fetch(VERCEL_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'delete_license',
            device_id: currentLicenseData.device_id,
            admin_secret: adminPasswordSecret
          })
        });

        const resData = await res.json();

        if (res.ok && resData.success) {
          showToast(`Lisensi Device ID ${currentLicenseData.device_id} berhasil dihapus!`);
          resetForm();
        } else {
          showToast(resData.message || 'Gagal menghapus lisensi dari database.', false);
        }
      } catch (e) {
        showToast('Error koneksi saat menghapus lisensi.', false);
      }
    }

    function resetForm() {
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step1').style.display = 'block';
      document.getElementById('inputDeviceId').value = '';
      currentLicenseData = null;
    }
  </script>
</body>
</html>
