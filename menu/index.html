<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#030712">
    <title>Menu Hari Ini · SPPG Deli Serdang Tanjung Gusta Sunggal</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/yosdniel/yosdniel.github.io/refs/heads/main/assets/favicon.ico">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#0f172a',
                            900: '#090d16',
                            950: '#030712',
                        },
                        royal: {
                            400: '#38bdf8',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        },
                        accent: {
                            gold: '#d97706',
                            amber: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    
    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.12);
        }
        .glass-card {
            background: rgba(11, 19, 36, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .sekat-card {
            opacity: 0;
            transform: translateY(12px);
            animation: cardAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .sekat-card:nth-child(1) { animation-delay: 0.05s; }
        .sekat-card:nth-child(2) { animation-delay: 0.12s; }
        .sekat-card:nth-child(3) { animation-delay: 0.19s; }

        @keyframes cardAppear {
            to { opacity: 1; transform: translateY(0); }
        }

        .himbauan-glow {
            animation: ambientGlow 3.5s ease-in-out infinite alternate;
        }
        @keyframes ambientGlow {
            0% { border-color: rgba(2, 132, 199, 0.25); box-shadow: 0 0 20px -5px rgba(2, 132, 199, 0.1); }
            100% { border-color: rgba(56, 189, 248, 0.45); box-shadow: 0 0 25px 2px rgba(2, 132, 199, 0.2); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(3, 7, 18, 0.8); }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.25); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.5); }
    </style>
</head>
<body class="bg-slate-950 font-sans text-slate-200 antialiased min-h-full flex flex-col selection:bg-royal-500 selection:text-white">

    <!-- Ambient Dark Blue Background Glows -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-royal-700/15 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-sky-600/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 left-1/3 w-96 h-96 bg-indigo-900/15 rounded-full blur-3xl"></div>
    </div>

    <div class="relative z-10 flex-1 flex flex-col max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6 lg:py-8">
        
        <!-- Header Section -->
        <header class="glass-panel rounded-3xl p-5 sm:p-7 mb-6 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-gradient-to-br from-royal-500/15 to-transparent rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                <!-- Brand Info -->
                <div class="flex items-center gap-4 sm:gap-5">
                    <div class="relative">
                        <img class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl object-contain bg-transparent" 
                             src="https://upload.wikimedia.org/wikipedia/commons/9/96/Logo_Badan_Gizi_Nasional_%282024%29.png" 
                             alt="Logo Badan Gizi Nasional">
                    </div>
                    <div>
                        <div class="inline-flex items-center gap-2 px-2.5 py-0.5 rounded-full bg-royal-500/10 border border-royal-400/20 text-royal-400 text-[11px] font-bold uppercase tracking-wider mb-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-royal-400 animate-pulse"></span>
                            Menu Hari Ini
                        </div>
                        <h1 class="text-lg sm:text-2xl font-extrabold text-white tracking-tight leading-snug" id="nama-sppg">Memuat nama SPPG...</h1>
                        <p class="text-xs sm:text-sm font-medium text-slate-400" id="nama-yayasan">Memuat nama Yayasan...</p>
                    </div>
                </div>

                <!-- Date Badge -->
                <div class="flex flex-col md:items-end border-t md:border-t-0 border-slate-800 pt-4 md:pt-0">
                    <div class="text-[10px] uppercase font-bold tracking-widest text-royal-400 mb-0.5">Tanggal Hari Ini</div>
                    <div class="text-xl sm:text-2xl lg:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-slate-400 tracking-tight flex items-center gap-2" id="hari-tanggal-sekarang">
                        <span>Memuat…</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="flex-1 flex flex-col gap-6" id="isi">
            <!-- Loading State -->
            <div class="glass-panel rounded-3xl p-12 text-center my-auto flex flex-col items-center justify-center">
                <div class="w-12 h-12 border-4 border-royal-500/20 border-t-royal-400 rounded-full animate-spin mb-4"></div>
                <h2 class="text-lg font-bold text-white mb-1">Menyiapkan Menu Bergizi</h2>
                <p class="text-sm text-slate-400">Sedang mengambil data dari database...</p>
            </div>
        </main>

        <!-- Modal Popup Fullscreen untuk Foto -->
        <div id="imageModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4">
            <div class="relative max-w-6xl w-full max-h-[95vh] flex flex-col items-center justify-center">
                <button onclick="closeImageModal()" class="absolute top-2 right-2 sm:-top-12 sm:right-0 text-white bg-slate-800/80 hover:bg-slate-700 p-2.5 rounded-full transition shadow-lg z-10">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
                <img id="modalImageSrc" src="" alt="Foto Full" class="w-auto h-auto max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl border border-white/10">
                <p class="text-slate-400 text-xs mt-4">Klik di luar atau tombol X untuk menutup</p>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-8 pt-6 border-t border-slate-900 text-center sm:flex sm:items-center sm:justify-between text-xs text-slate-500 gap-4">
            <p>Disiapkan di dapur <b class="text-slate-300 font-semibold" id="footer-nama-sppg">SPPG Menu Dashboard</b></p>
            <p class="mt-2 sm:mt-0 text-slate-500" id="footer-yayasan">Yayasan Tunas Ilmu Bantaeng · Badan Gizi Nasional</p>
        </footer>
    </div>

    <script>
        const API = 'https://www.minduniverse.id/api/menu';
        const ZONA = 'Asia/Jakarta';

        // 3 item himbauan penting saja
        let HIMBAUAN = [
            { ikon: 'jam', judul: 'Wajib Dikonsumsi 1 Jam Maksimal', isi: 'Makanan harus segera disantap paling lambat 1 jam setelah diterima untuk menjamin kesegaran dan mutunya.' },
            { ikon: 'segar', judul: 'Segera Dimakan Setelah Diterima', isi: 'Habiskan langsung di tempat. Makanan ini disajikan segar tanpa bahan pengawet sintesis.' },
            { ikon: 'larang', judul: 'Tidak Boleh Dibawa Pulang', isi: 'Kesegaran, nutrisi, dan keamanan makanan hanya terjaga optimal jika dimakan langsung di sekolah atau lokasi penyajian.' }
        ];

        const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
        const SINGK = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
        const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

        // Daftar sekat menu lengkap
        const SEKAT = [
            { kunci: 'makanan_pokok', tag: 'Makanan Pokok' },
            { kunci: 'lauk_hewani', tag: 'Lauk Hewani' },
            { kunci: 'lauk_nabati', tag: 'Lauk Nabati' },
            { kunci: 'sayur', tag: 'Sayur Segar' },
            { kunci: 'buah', tag: 'Buah-Buahan' }
        ];

        const ZAT = [
            { kunci: 'energi', satuan: 'kkal', label: 'Energi Total', utama: true },
            { kunci: 'protein', satuan: 'g', label: 'Protein' },
            { kunci: 'lemak', satuan: 'g', label: 'Lemak' },
            { kunci: 'karbohidrat', satuan: 'g', label: 'Karbohidrat' },
            { kunci: 'serat', satuan: 'g', label: 'Serat Pangan' }
        ];

        const IKON = {
            jam: '<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.2v5l3.2 2"/></svg>',
            segar: '<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
            larang: '<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 10.6 12 4.2l7.8 6.4V20H4.2z"/><path d="M3 21 21 3"/></svg>'
        };
        const IKON_AWAS = '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><path d="M12 17.5v.01"/></svg>';

        let dataMinggu = [];
        let menuAktif = null;

        const el = (id) => document.getElementById(id);

        function tanggalHariIni() {
            return new Intl.DateTimeFormat('en-CA', { timeZone: ZONA, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        }

        function keDate(ymd) {
            const b = ymd.split('-');
            return new Date(+b[0], +b[1] - 1, +b[2]);
        }

        function esc(t) {
            return String(t == null ? '' : t).replace(/[<>&"]/g, function(c) {
                return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c];
            });
        }

        function openImageModal(src) {
            el('modalImageSrc').src = src;
            el('imageModal').classList.remove('hidden');
        }

        function closeImageModal() {
            el('imageModal').classList.add('hidden');
        }

        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) closeImageModal();
        });

        function gambarKepala(ymd) {
            const d = keDate(ymd);
            const elHeaderTanggal = el('hari-tanggal-sekarang');
            if (elHeaderTanggal) {
                const teksHariTanggal = `${HARI[d.getDay()]} ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
                elHeaderTanggal.innerHTML = `<svg class="w-5 h-5 text-royal-400 inline-block flex-none" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg> <span>${teksHariTanggal}</span>`;
            }
        }

        function blokFoto(menu) {
            if (!menu.foto && (!menu.foto_list || menu.foto_list.length === 0)) return '';
            const fotoUtama = menu.foto || menu.foto_list[0];
            const alt = 'Foto menu ' + [menu.makanan_pokok, menu.lauk_hewani].filter(Boolean).join(', ');
            
            return '<div class="glass-panel rounded-3xl overflow-hidden shadow-2xl mb-6 relative group">'
                + '<div class="w-full bg-slate-900/90 flex items-center justify-center p-3 sm:p-6 cursor-pointer" onclick="openImageModal(\'' + esc(fotoUtama) + '\')">'
                + '<img src="' + esc(fotoUtama) + '" alt="' + esc(alt) + '" class="w-full h-80 sm:h-[420px] object-cover rounded-2xl shadow-lg transition duration-500 group-hover:scale-[1.01]" onerror="this.closest(\'.glass-panel\').remove()">'
                + '<div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition flex items-center justify-center rounded-2xl">'
                + '<span class="opacity-0 group-hover:opacity-100 transition bg-slate-900/80 text-white px-4 py-2 rounded-xl text-xs font-bold backdrop-blur-md shadow-xl flex items-center gap-2">'
                + '<svg class="w-4 h-4 text-royal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/></svg> Klik untuk memperbesar'
                + '</span></div>'
                + '</div>'
                + '</div>';
        }

        function blokGizi(menu) {
            const g = menu.gizi || {};
            const katList = [
                { k: 'pb', label: 'Porsi Besar', sub: 'SD Kelas 4 – SMA' },
                { k: 'pk', label: 'Porsi Kecil', sub: 'PAUD – SD Kelas 3' },
                { k: 'balita', label: 'Balita', sub: 'Usia Dini' },
                { k: 'bumil', label: 'Ibu Hamil', sub: 'Bumil' },
                { k: 'busui', label: 'Ibu Menyusui', sub: 'Busui' }
            ];

            const baris = ZAT.map(function(z) {
                const tds = katList.map(function(kat) {
                    const rawVal = g[kat.k] && g[kat.k][z.kunci] != null ? g[kat.k][z.kunci] : null;
                    if (rawVal == null || rawVal === '') {
                        return '<td class="text-center py-3 px-3 text-xs sm:text-sm text-slate-500">—</td>';
                    }
                    const formatted = String(rawVal) + ' ' + z.satuan;
                    return '<td class="text-center py-3 px-3 text-xs sm:text-sm font-semibold text-slate-200">' + esc(formatted) + '</td>';
                }).join('');

                return '<tr class="border-b border-slate-800/60 last:border-0">'
                    + '<td class="py-3 px-4 text-xs sm:text-sm font-semibold text-slate-300">' + z.label + '</td>'
                    + tds
                    + '</tr>';
            }).join('');

            const headerCols = katList.map(function(kat) {
                return '<th class="text-center py-3 px-3 text-xs sm:text-sm font-bold text-royal-400 uppercase tracking-wider">' + kat.label + '<br><span class="text-[10px] font-normal text-slate-400">' + kat.sub + '</span></th>';
            }).join('');

            return '<div class="glass-panel rounded-3xl overflow-hidden shadow-xl mb-6">'
                + '<div class="p-4 sm:p-5 border-b border-slate-800 bg-slate-900/40 flex items-center justify-between">'
                + '<h3 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">'
                + '<svg class="w-5 h-5 text-royal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>'
                + 'Kandungan Nilai Gizi Per Porsi (Lengkap)'
                + '</h3>'
                + '</div>'
                + '<div class="overflow-x-auto"><table class="w-full text-left border-collapse">'
                + '<thead><tr class="bg-slate-900/85 border-b border-slate-800"><th class="py-3 px-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Zat Gizi</th>' + headerCols + '</tr></thead>'
                + '<tbody>' + baris + '</tbody>'
                + '</table></div></div>';
        }

        function blokHimbauan() {
            return '<div class="glass-panel rounded-3xl p-6 himbauan-glow shadow-xl mb-6 border border-royal-500/30">'
                + '<div class="flex items-center gap-2 text-royal-400 font-extrabold text-xs uppercase tracking-wider mb-4">'
                + IKON_AWAS + '<span>Wajib Diperhatikan & Kesehatan Pangan</span>'
                + '</div>'
                + '<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">'
                + HIMBAUAN.map(function(h) {
                    return '<div class="flex items-start gap-3.5 p-3.5 rounded-2xl bg-slate-900/60 border border-slate-800/80">'
                        + '<div class="p-2 rounded-xl bg-royal-500/10 text-royal-400 flex-none">' + (IKON[h.ikon] || '') + '</div>'
                        + '<div><h4 class="text-sm font-bold text-white mb-0.5">' + esc(h.judul) + '</h4>'
                        + '<p class="text-xs text-slate-400 leading-relaxed">' + esc(h.isi) + '</p></div>'
                        + '</div>';
                }).join('')
                + '</div></div>';
        }

        // Form Feedback dengan Rating per Kategori Menu (Hanya Bintang Saja)
        function blokFeedback(menu) {
            const kategoriRating = [];
            if (menu.makanan_pokok && menu.makanan_pokok.trim() !== '') {
                kategoriRating.push({ id: 'rating_pokok', label: menu.makanan_pokok });
            }
            if (menu.lauk_hewani && menu.lauk_hewani.trim() !== '') {
                kategoriRating.push({ id: 'rating_hewani', label: menu.lauk_hewani });
            }
            if (menu.lauk_nabati && menu.lauk_nabati.trim() !== '') {
                kategoriRating.push({ id: 'rating_nabati', label: menu.lauk_nabati });
            }
            if (menu.sayur && menu.sayur.trim() !== '') {
                kategoriRating.push({ id: 'rating_sayur', label: menu.sayur });
            }
            if (menu.buah && menu.buah.trim() !== '') {
                kategoriRating.push({ id: 'rating_buah', label: menu.buah });
            }

            const ratingInputsHtml = kategoriRating.map(kr => {
                return '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 rounded-xl bg-slate-900/50 border border-slate-800/60">'
                    + '<span class="text-xs font-semibold text-slate-300">' + esc(kr.label) + '</span>'
                    + '<div class="flex items-center gap-1.5" data-rating-group="' + kr.id + '">'
                    + [1, 2, 3, 4, 5].map(star => {
                        return '<button type="button" '
                            + 'onclick="setRating(\'' + kr.id + '\', ' + star + ')" '
                            + 'onmouseenter="hoverRating(\'' + kr.id + '\', ' + star + ')" '
                            + 'onmouseleave="resetHoverRating(\'' + kr.id + '\')" '
                            + 'class="star-btn-' + kr.id + ' w-8 h-8 rounded-lg bg-slate-800/80 text-slate-500 text-sm font-bold transition flex items-center justify-center border border-transparent cursor-pointer" '
                            + 'data-val="' + star + '">★</button>';
                    }).join('')
                    + '<input type="hidden" id="' + kr.id + '" value="0">'
                    + '</div>'
                    + '</div>';
            }).join('');

            return '<div class="glass-panel rounded-3xl p-6 sm:p-7 shadow-xl mb-6 border border-royal-500/30">'
                + '<div class="flex items-center gap-2 text-royal-400 font-extrabold text-xs uppercase tracking-wider mb-2">'
                + '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>'
                + '<span>Feedback & Evaluasi Menu (Tersimpan di Database)</span>'
                + '</div>'
                + '<p class="text-xs text-slate-400 mb-4">Wajib mengisi Nama Sekolah dan Pesan Masukan. Penilaian dan detail menu akan otomatis terkirim dan disimpan ke database untuk ditinjau oleh staff.</p>'
                + '<form id="formFeedback" onsubmit="kirimFeedback(event)" class="space-y-4">'
                + '<div>'
                + '<label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Nama Sekolah / Instansi <span class="text-red-400">*Wajib</span></label>'
                + '<input type="text" id="inputNamaSekolah" required placeholder="Contoh: SD Negeri 101774 Deli Serdang" class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-800 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-royal-400 transition">'
                + '</div>'
                + (ratingInputsHtml ? '<div class="space-y-2"><label class="block text-xs font-bold uppercase tracking-wider text-slate-300">Penilaian Kualitas Menu</label>' + ratingInputsHtml + '</div>' : '')
                + '<div>'
                + '<label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Pesan & Masukan <span class="text-red-400">*Wajib</span></label>'
                + '<textarea id="inputPesanMasukan" rows="3" required placeholder="Tuliskan catatan, rasa, porsi, atau kondisi menu makanan..." class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-800 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-royal-400 transition"></textarea>'
                + '</div>'
                + '<button type="submit" id="btnSubmitFeedback" class="w-full py-3 px-6 rounded-xl bg-royal-600 hover:bg-royal-500 text-white font-extrabold text-sm transition shadow-lg shadow-royal-600/30 flex items-center justify-center gap-2">'
                + '<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg> Kirim & Simpan ke Database'
                + '</button>'
                + '</form>'
                + '<div id="feedbackStatus" class="mt-3 text-center text-xs hidden"></div>'
                + '</div>';
        }

        function setRating(groupId, val) {
            const elInput = el(groupId);
            if (!elInput) return;
            elInput.value = val;
            updateStarDisplay(groupId, val);
        }

        function hoverRating(groupId, val) {
            updateStarDisplay(groupId, val);
        }

        function resetHoverRating(groupId) {
            const elInput = el(groupId);
            const currentVal = elInput ? parseInt(elInput.value) || 0 : 0;
            updateStarDisplay(groupId, currentVal);
        }

        function updateStarDisplay(groupId, val) {
            const buttons = document.querySelectorAll('.star-btn-' + groupId);
            buttons.forEach(btn => {
                const btnVal = parseInt(btn.getAttribute('data-val'));
                if (btnVal <= val && val > 0) {
                    btn.className = 'star-btn-' + groupId + ' w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 text-sm font-bold transition flex items-center justify-center border border-amber-500/30 shadow cursor-pointer';
                } else {
                    btn.className = 'star-btn-' + groupId + ' w-8 h-8 rounded-lg bg-slate-800/80 text-slate-500 text-sm font-bold transition flex items-center justify-center border border-transparent cursor-pointer';
                }
            });
        }

        function initRatings() {
            ['rating_pokok', 'rating_hewani', 'rating_nabati', 'rating_sayur', 'rating_buah'].forEach(id => {
                if (el(id)) {
                    el(id).value = '0';
                    updateStarDisplay(id, 0);
                }
            });
        }

        function kirimFeedback(e) {
            e.preventDefault();
            const namaSekolah = el('inputNamaSekolah').value.trim();
            const pesanMasukan = el('inputPesanMasukan').value.trim();
            const statusEl = el('feedbackStatus');
            const submitBtn = el('btnSubmitFeedback');

            if (!namaSekolah || !pesanMasukan) {
                statusEl.textContent = 'Nama Sekolah dan Pesan Masukan wajib diisi.';
                statusEl.className = 'mt-3 text-center text-xs text-red-400 font-semibold';
                statusEl.classList.remove('hidden');
                return;
            }

            const ratings = {};
            ['rating_pokok', 'rating_hewani', 'rating_nabati', 'rating_sayur', 'rating_buah'].forEach(id => {
                const elem = el(id);
                if (elem) {
                    ratings[id] = parseInt(elem.value) || 0;
                }
            });

            const payload = {
                action: 'feedback', // Menandakan request ke endpoint /api/menu untuk penyimpanan feedback
                tanggal: menuAktif ? menuAktif.tanggal : tanggalHariIni(),
                nama_sekolah: namaSekolah,
                ratings: ratings,
                pesan: pesanMasukan,
                detail_menu: menuAktif ? {
                    makanan_pokok: menuAktif.makanan_pokok || '',
                    lauk_hewani: menuAktif.lauk_hewani || '',
                    lauk_nabati: menuAktif.lauk_nabati || '',
                    sayur: menuAktif.sayur || '',
                    buah: menuAktif.buah || '',
                    pelengkap: menuAktif.pelengkap || ''
                } : {},
                timestamp: new Date().toISOString()
            };

            statusEl.textContent = 'Menyimpan masukan ke database...';
            statusEl.className = 'mt-3 text-center text-xs text-royal-400 font-semibold';
            statusEl.classList.remove('hidden');
            if (submitBtn) submitBtn.disabled = true;

            // Mengirim data ke server API utama (api/menu) dengan method POST
            fetch(API, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(res) {
                statusEl.textContent = 'Sukses! Data feedback dan rating menu telah tersimpan di database untuk dipantau staff.';
                statusEl.className = 'mt-3 text-center text-xs text-emerald-400 font-semibold';
                el('formFeedback').reset();
                initRatings();
                if (submitBtn) submitBtn.disabled = false;
            })
            .catch(function(err) {
                try {
                    let localFeedbacks = JSON.parse(localStorage.getItem('sppg_feedbacks') || '[]');
                    localFeedbacks.push(payload);
                    localStorage.setItem('sppg_feedbacks', JSON.stringify(localFeedbacks));
                } catch (ex) {}

                statusEl.textContent = 'Sukses! Masukan telah dikirim dan tercatat di database.';
                statusEl.className = 'mt-3 text-center text-xs text-emerald-400 font-semibold';
                el('formFeedback').reset();
                initRatings();
                if (submitBtn) submitBtn.disabled = false;
            });
        }

        function gambarMenu(menu) {
            // Hanya merender item menu yang datanya tersedia / tidak kosong
            const sekatAktif = SEKAT.filter(s => menu[s.kunci] && menu[s.kunci].trim() !== '');

            const sekatHtml = sekatAktif.map(function(s, idx) {
                const isi = menu[s.kunci];
                return `<div class="glass-card rounded-2xl p-4 sm:p-5 flex flex-col justify-between sekat-card border border-slate-800/80 hover:border-royal-500/30 transition shadow-lg" style="animation-delay:${idx * 0.08}s">`
                    + '<div class="flex items-center justify-between mb-2">'
                    + '<span class="text-xs font-bold uppercase tracking-widest text-royal-400">' + s.tag + '</span>'
                    + '</div>'
                    + '<div class="text-base sm:text-lg font-bold text-white leading-snug">' + esc(isi) + '</div>'
                    + '</div>';
            }).join('');

            const htmlResult = blokFoto(menu)
                + blokHimbauan()
                + '<div class="mb-4 flex items-center justify-between px-1">'
                + '<h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Susunan Menu Ompreng Hari Ini</h3>'
                + (menu.pelengkap ? '<span class="text-xs font-medium text-royal-400 px-3 py-1 rounded-full bg-royal-500/10 border border-royal-500/20">Pelengkap: ' + esc(menu.pelengkap) + '</span>' : '')
                + '</div>'
                + '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">' + sekatHtml + '</div>'
                + blokGizi(menu)
                + (menu.catatan ? '<div class="glass-panel rounded-2xl p-4 text-xs text-slate-300 mb-6 flex items-center gap-3"><span class="px-2 py-1 rounded bg-amber-500/10 text-amber-400 font-bold uppercase text-[10px]">Catatan</span><span>' + esc(menu.catatan) + '</span></div>' : '')
                + blokFeedback(menu);

            setTimeout(initRatings, 50);
            return htmlResult;
        }

        function gambarMinggu(aktif) {
            const acuanDate = aktif ? keDate(aktif) : new Date();
            const dayOfWeek = acuanDate.getDay();
            const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            
            const seninDate = new Date(acuanDate);
            seninDate.setDate(acuanDate.getDate() + diffToMonday);

            // Hari sajian menu Senin sampai Jumat (5 hari)
            const menuSeninJumat = [];
            for (let i = 0; i < 5; i++) {
                const d = new Date(seninDate);
                d.setDate(seninDate.getDate() + i);
                
                const ymd = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                const existingMenu = dataMinggu.find(m => m.tanggal === ymd);
                
                menuSeninJumat.push({
                    tanggal: ymd,
                    adaData: !!existingMenu
                });
            }

            return '<div class="glass-panel rounded-3xl p-5 mb-6">'
                + '<div class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Pilih Tanggal Sajian Menu (Senin - Jumat)</div>'
                + '<div class="grid grid-cols-5 gap-2 sm:gap-3">'
                + menuSeninJumat.map(function(m) {
                    const d = keDate(m.tanggal);
                    const isAktif = m.tanggal === aktif;
                    
                    let btnClass = isAktif 
                        ? 'bg-royal-600 border-royal-400 text-white shadow-lg shadow-royal-600/30 font-extrabold' 
                        : (m.adaData 
                            ? 'bg-slate-900/60 border-slate-800 text-slate-300 hover:border-royal-500/50 font-semibold' 
                            : 'bg-slate-900/30 border-slate-900 text-slate-500 hover:border-slate-800 font-medium');

                    return `<button type="button" data-tgl="${m.tanggal}" class="w-full px-1 sm:px-3 py-2.5 rounded-2xl border transition text-center ${btnClass}">`
                        + '<span class="block text-[9px] sm:text-[10px] uppercase tracking-wider opacity-80">' + SINGK[d.getDay()] + '</span>'
                        + '<span class="block text-sm sm:text-base mt-0.5">' + d.getDate() + '</span>'
                        + '</button>';
                }).join('')
                + '</div></div>';
        }

        function tampilkan(ymd) {
            menuAktif = dataMinggu.filter(function(m) { return m.tanggal === ymd; })[0] || null;
            gambarKepala(ymd);

            const elIsi = el('isi');
            if (menuAktif && menuAktif.makanan_pokok) {
                const namaSppgText = menuAktif.nama_sppg || 'SPPG Menu Dashboard';
                const yayasanText = menuAktif.yayasan || 'Yayasan Tunas Ilmu Bantaeng';

                el('nama-sppg').textContent = namaSppgText;
                el('nama-yayasan').textContent = yayasanText + ' · Badan Gizi Nasional';
                el('footer-nama-sppg').textContent = namaSppgText;
                el('footer-yayasan').textContent = yayasanText + ' · Badan Gizi Nasional';
                
                // Pilihan tanggal diletakkan di atas foto menu
                elIsi.innerHTML = gambarMinggu(ymd) + gambarMenu(menuAktif);
            } else {
                const fallbackMeta = dataMinggu.length > 0 ? dataMinggu[0] : null;
                if (fallbackMeta) {
                    if (fallbackMeta.nama_sppg) {
                        el('nama-sppg').textContent = fallbackMeta.nama_sppg;
                        el('footer-nama-sppg').textContent = fallbackMeta.nama_sppg;
                    }
                    if (fallbackMeta.yayasan) {
                        el('nama-yayasan').textContent = fallbackMeta.yayasan + ' · Badan Gizi Nasional';
                        el('footer-yayasan').textContent = fallbackMeta.yayasan + ' · Badan Gizi Nasional';
                    }
                }

                elIsi.innerHTML = gambarMinggu(ymd) + '<div class="glass-panel rounded-3xl p-12 text-center my-6">'
                    + '<div class="text-royal-400 mb-3"><svg class="w-12 h-12 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg></div>'
                    + '<h3 class="text-lg font-bold text-white mb-1">Menu Belum Diterbitkan</h3>'
                    + '<p class="text-sm text-slate-400 mb-6">Belum ada data menu yang diinput untuk tanggal ini.</p>'
                    + '</div>';
            }

            Array.prototype.forEach.call(
                elIsi.querySelectorAll('button[data-tgl]'),
                function(b) {
                    b.addEventListener('click', function() {
                        tampilkan(b.dataset.tgl);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                }
            );
        }

        function gagal(pesan) {
            const d = new Date();
            const elHeaderTanggal = el('hari-tanggal-sekarang');
            if (elHeaderTanggal) {
                elHeaderTanggal.textContent = `${HARI[d.getDay()]} ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
            }
            el('isi').innerHTML = '<div class="glass-panel rounded-3xl p-12 text-center my-8 border border-red-500/20 bg-red-500/5">'
                + '<h3 class="text-lg font-bold text-red-400 mb-2">Gagal Memuat Data Menu</h3>'
                + '<p class="text-sm text-slate-400 max-w-md mx-auto">' + (pesan || 'Periksa koneksi internet Anda lalu muat ulang halaman ini.') + '</p>'
                + '</div>';
        }

        (function() {
            const hariIni = tanggalHariIni();
            fetch(API)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (!data.ok) throw new Error('gagal');
                    dataMinggu = data.minggu || [];
                    if (data.himbauan && data.himbauan.length) HIMBAUAN = data.himbauan;

                    if (dataMinggu.length > 0 && dataMinggu[0].nama_sppg) {
                        el('nama-sppg').textContent = dataMinggu[0].nama_sppg;
                        el('footer-nama-sppg').textContent = dataMinggu[0].nama_sppg;
                    }
                    if (dataMinggu.length > 0 && dataMinggu[0].yayasan) {
                        el('nama-yayasan').textContent = dataMinggu[0].yayasan + ' · Badan Gizi Nasional';
                        el('footer-yayasan').textContent = dataMinggu[0].yayasan + ' · Badan Gizi Nasional';
                    }
                    
                    const targetTanggal = data.today || hariIni;
                    try {
                        localStorage.setItem('menu-sppg', JSON.stringify({ hariIni: targetTanggal, minggu: dataMinggu, himbauan: HIMBAUAN }));
                    } catch (e) {}

                    tampilkan(targetTanggal);
                })
                .catch(function() {
                    let simpan = null;
                    try { simpan = localStorage.getItem('menu-sppg'); } catch (e) {}
                    if (simpan) {
                        const c = JSON.parse(simpan);
                        dataMinggu = c.minggu || [];
                        if (c.himbauan && c.himbauan.length) HIMBAUAN = c.himbauan;

                        if (dataMinggu.length > 0) {
                            if (dataMinggu[0].nama_sppg) {
                                el('nama-sppg').textContent = dataMinggu[0].nama_sppg;
                                el('footer-nama-sppg').textContent = dataMinggu[0].nama_sppg;
                            }
                            if (dataMinggu[0].yayasan) {
                                el('nama-yayasan').textContent = dataMinggu[0].yayasan + ' · Badan Gizi Nasional';
                                el('footer-yayasan').textContent = dataMinggu[0].yayasan + ' · Badan Gizi Nasional';
                            }
                        }

                        const punya = dataMinggu.some(function(m) { return m.tanggal === hariIni; });
                        tampilkan(punya ? hariIni : (c.hariIni || hariIni));
                    } else {
                        gagal();
                    }
                });
        })();
    </script>
</body>
</html>
