<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download SIPGN Autofill Update - MindHUB</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = {
darkMode: 'class',
theme: {
extend: {
fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
colors: {
brand: {
400: '#818cf8',
500: '#6366f1',
600: '#4f46e5',
700: '#4338ca'
}
}
}
}
}
</script>
<style>
body { font-family: 'Plus Jakarta Sans', sans-serif; }
.glass-card {
background: rgba(15, 23, 42, 0.85);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid rgba(255, 255, 255, 0.08);
}
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased relative overflow-x-hidden selection:bg-brand-500 selection:text-white">
<!-- Ambient Background Effect -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900/30 via-slate-950 to-slate-950 pointer-events-none"></div>
<!-- Main Card Container -->
<div class="glass-card w-full max-w-md p-6 sm:p-8 rounded-3xl shadow-2xl relative z-10 border border-slate-800 text-center my-auto">
<!-- Icon Header -->
<div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-500 to-indigo-600 mx-auto flex items-center justify-center text-white text-2xl mb-4 shadow-xl shadow-brand-500/30 border border-indigo-400/30">
🚀
</div>
<h2 class="font-extrabold text-xl sm:text-2xl text-white tracking-tight">SIPGN Autofill</h2>
<p class="text-xs text-slate-400 mt-1 leading-relaxed">Skrip Otomatisasi Tugas Pengiriman & Distribusi POP</p>
<!-- Version Badge -->
<div class="my-6 p-4 rounded-2xl bg-slate-900/80 border border-slate-800/80 flex items-center justify-between">
<span class="text-xs font-semibold text-slate-400">Versi Rilis Terbaru:</span>
<span id="latest-version" class="px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-bold font-mono">Memuat...</span>
</div>
<!-- Download Button -->
<a id="download-btn" href="#" target="_blank" class="w-full inline-flex items-center justify-center gap-2 bg-slate-900 text-slate-500 font-bold py-3.5 px-4 rounded-2xl text-xs sm:text-sm transition duration-200 border border-slate-800 cursor-not-allowed">
<svg class="animate-spin h-4 w-4 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
</svg>
<span>Memuat Link Download...</span>
</a>
<!-- Changelog Box -->
<div class="mt-6 text-left bg-slate-900/90 p-4 rounded-2xl border border-slate-800/80">
<div class="flex items-center gap-1.5 mb-2">
<span class="w-2 h-2 rounded-full bg-brand-500"></span>
<b class="text-brand-400 uppercase text-[10px] tracking-wider">Catatan Pembaruan:</b>
</div>
<div id="changelog-text" class="text-xs text-slate-300 leading-relaxed">
<span class="text-slate-500 italic">Memuat changelog...</span>
</div>
</div>
<!-- Footer -->
<div class="mt-6 pt-4 border-t border-slate-800/80 text-center">
<span class="text-[10px] text-slate-500">Mindspace Studio © 2026</span>
</div>
</div>
<script>
const API_URL = 'https://mindspace-id.vercel.app/api/tokopay?action=check_version';
const FALLBACK_DOWNLOAD_URL = 'https://mindspace-id.vercel.app/files/sipgn-autofill.user.js';
const FALLBACK_VERSION = 'v1.5.42';
// Formatter to render clean HTML bullet lists for lines starting with "-", "•", "*" or numbers
function renderFormattedChangelog(rawText) {
if (!rawText) return '<div class="text-slate-500 italic">Tidak ada catatan pembaruan.</div>';
const lines = rawText.split('\n');
let htmlOutput = '';
let inList = false;
lines.forEach(line => {
const trimmed = line.trim();
if (!trimmed) return;
const isBullet = /^[-•*]\s+/.test(trimmed);
const isNumbered = /^\d+[.)]\s+/.test(trimmed);
if (isBullet || isNumbered) {
if (!inList) {
htmlOutput += '<ul class="space-y-1.5 my-1 pl-0.5">';
inList = true;
}
const content = trimmed.replace(/^([-•*]|\d+[.)])\s+/, '');
htmlOutput += <li class="flex items-start gap-2"><span class="text-brand-400 font-bold shrink-0 select-none">•</span><span>${content}</span></li>;
} else {
if (inList) {
htmlOutput += '</ul>';
inList = false;
}
htmlOutput += <p class="mb-1 text-slate-300">${trimmed}</p>;
}
});
if (inList) {
htmlOutput += '</ul>';
}
return htmlOutput || <p class="text-slate-300">${rawText}</p>;
}
function applyFallbackState() {
const btn = document.getElementById('download-btn');
const verEl = document.getElementById('latest-version');
const changeEl = document.getElementById('changelog-text');
verEl.innerText = FALLBACK_VERSION;
btn.href = FALLBACK_DOWNLOAD_URL;
btn.className = "w-full inline-flex items-center justify-center gap-2 bg-gradient-to-r from-brand-500 to-indigo-600 hover:from-brand-600 hover:to-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-2xl text-xs sm:text-sm transition duration-200 shadow-lg shadow-indigo-500/25";
btn.innerHTML = '📥 Download (Link Cadangan)';
changeEl.innerHTML = renderFormattedChangelog(
"- Pembaruan stabilitas koneksi otomatisasi SIPGN\n- Penyesuaian skrip dengan update sistem terbaru\n- Optimalisasi pengisian formulir distribusi POP"
);
}
async function loadVersionInfo() {
const controller = new AbortController();
const timeoutId = setTimeout(() => controller.abort(), 6000); // 6s timeout safeguard
try {
const res = await fetch(API_URL, {
signal: controller.signal,
headers: { 'Accept': 'application/json' }
});
clearTimeout(timeoutId);
if (!res.ok) throw new Error(HTTP Error Status: ${res.status});
const data = await res.json();
// Flexible key extraction
const version = data.version || (data.data && data.data.version);
const downloadUrl = data.download_url || (data.data && data.data.download_url);
const changelog = data.changelog || (data.data && data.data.changelog);
if (version && downloadUrl) {
document.getElementById('latest-version').innerText = v${version.replace(/^v/i, '')};
const btn = document.getElementById('download-btn');
btn.href = downloadUrl;
btn.className = "w-full inline-flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 active:scale-[0.99] text-slate-950 font-extrabold py-3.5 px-4 rounded-2xl text-xs sm:text-sm transition duration-200 shadow-lg shadow-amber-500/20";
btn.innerHTML = '📥 Download & Install Script';
document.getElementById('changelog-text').innerHTML = renderFormattedChangelog(changelog);
} else {
throw new Error('Informasi versi dari server tidak lengkap');
}
} catch (err) {
console.warn('Gagal memuat API versi server, beralih ke link cadangan:', err);
applyFallbackState();
}
}
// Execute on page load
loadVersionInfo();
</script>
</body>
</html>
