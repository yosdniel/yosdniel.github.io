<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Download SIPGN Autofill Update</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-download.disabled { background: #1e293b !important; color: #64748b !important; border: 1px solid rgba(255, 255, 255, 0.04); pointer-events: none; cursor: not-allowed; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4 selection:bg-brand-500 selection:text-white relative overflow-x-hidden">

  <!-- Background Glow Effect -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-950 to-slate-950 pointer-events-none"></div>

  <div class="glass-card rounded-3xl p-6 sm:p-8 w-full max-w-sm text-center shadow-2xl relative z-10 border border-slate-800">
    <div class="w-14 h-14 bg-brand-500/10 border border-brand-500/20 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-3 shadow-lg shadow-brand-500/20">🚀</div>
    
    <h2 class="font-extrabold text-lg sm:text-xl text-white tracking-tight">SIPGN Autofill</h2>
    <p class="text-xs text-slate-400 mt-1 leading-relaxed">Skrip Otomatisasi Tugas Pengiriman & Distribusi POP</p>
    
    <div class="my-5 py-3 bg-slate-900/60 rounded-2xl border border-slate-800/80">
      <span class="text-[10px] font-extrabold text-slate-500 uppercase tracking-wider">Versi Terbaru</span><br>
      <b id="latest-version" class="text-emerald-400 font-black text-lg sm:text-xl mt-0.5 inline-block">v...</b>
    </div>

    <!-- Tombol Download (Mulai dari status Loading) -->
    <a id="download-btn" href="#" target="_blank" class="btn-download block bg-gradient-to-r from-brand-500 to-indigo-600 hover:from-brand-600 hover:to-indigo-700 active:scale-[0.98] text-white font-bold py-3.5 px-4 rounded-2xl text-xs sm:text-sm transition shadow-xl shadow-brand-500/25">
      ⏳ Memuat Link Download...
    </a>

    <div class="mt-5 text-left bg-slate-900/90 p-4 rounded-2xl border border-slate-800/80">
      <div class="text-[10px] font-extrabold text-brand-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
        <span>📋</span> Catatan Pembaruan:
      </div>
      <!-- Perbaikan formatting bullet points (indentasi & line-height rapi) -->
      <div id="changelog-text" class="changelog-content text-xs text-slate-300 leading-relaxed font-mono whitespace-pre-wrap pl-1">Memuat changelog...</div>
    </div>
  </div>

  <script>
    const API_URL = 'https://mindspace-id.vercel.app/api/tokopay?action=check_version';

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        const btn = document.getElementById('download-btn');
        const verEl = document.getElementById('latest-version');
        const changeEl = document.getElementById('changelog-text');

        if (data && data.version && data.download_url) {
          verEl.innerText = `v${data.version}`;
          
          // Mengeset link tombol sesuai URL yang diinput Admin
          btn.href = data.download_url;
          btn.innerHTML = '📥 Download & Install Script';
          btn.classList.remove('disabled');

          changeEl.innerText = data.changelog || 'Perbaikan performa dan penyesuaian sistem.';
        } else {
          throw new Error('Data tidak lengkap');
        }
      })
      .catch(() => {
        const btn = document.getElementById('download-btn');
        document.getElementById('latest-version').innerText = 'v1.5.42';
        document.getElementById('changelog-text').innerText = 'Gagal memuat informasi versi dari server.';
        
        // Link cadangan jika API terganggu
        btn.href = 'https://mindspace-id.vercel.app/files/sipgn-autofill.user.js';
        btn.innerHTML = '📥 Download (Link Cadangan)';
        btn.classList.remove('disabled');
      });
  </script>
</body>
</html>
